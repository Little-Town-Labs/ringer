# Dedicated Postgres for Ringer shared evidence (spec 002-shared-evidence, R1).
# Draft for review. Not applied anywhere.
#
# On aegis-prod, from a dedicated directory (e.g. ~/ringer-postgres/):
#   1. Create .env (mode 600) with RINGER_OWNER_PW, RINGER_WRITER_PW, RINGER_READER_PW.
#   2. docker compose up -d
#   3. Apply schema.sql (see its header) using the owner role.
# Own container, own volume, own credentials: nothing is shared with other apps.
services:
  ringer-postgres:
    image: postgres:16-alpine
    container_name: ringer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ringer
      POSTGRES_USER: ringer_owner
      POSTGRES_PASSWORD: ${RINGER_OWNER_PW:?set RINGER_OWNER_PW in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=40
    ports:
      # Tailscale address only. Never 0.0.0.0.
      - "100.100.1.21:5440:5432"
    volumes:
      - ringer-pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringer_owner -d ringer"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ringer-pgdata:
